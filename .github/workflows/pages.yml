name: Publicar Mi Control de Alícuotas
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
      - name: Preparar sitio sin datos clínicos
        run: |
          set -euo pipefail
          mkdir -p site
          base64 -d .deploy/web.xz.b64 | tar -xJf - -C site
          test -f site/index.html
          test -f site/app.js
          test -f site/sw.js
          test -f site/firebase-config.js
          test ! -e site/bridge
          test ! -e site/INICIAR-CON-EXCEL.bat
          test ! -e site/firebase/firestore.rules
          if find site -type f \( -iname "*.xlsx" -o -iname "*.xlsm" -o -iname "*.sqlite3" -o -iname "*.db" \) | grep -q .; then
            echo "::error::Se detectó un archivo Excel o una base local en la carpeta web."
            exit 1
          fi
      - name: Configurar automáticamente la clave web PÚBLICA cuando exista
        env:
          FIREBASE_WEB_API_KEY: ${{ vars.FIREBASE_WEB_API_KEY }}
        run: python3 .github/scripts/inject_firebase_config.py
      - name: Corregir cliente de Firestore y preparar lectura de capturas remotas
        run: |
          python3 .github/scripts/patch_web_cloud.py
          python3 .github/scripts/patch_onedrive_history_ui.py
          python3 .github/scripts/patch_excel_center.py
          cp web-import/xlsx-reader.js site/xlsx-reader.js
          python3 .github/scripts/patch_xlsx_import.py
          python3 .github/scripts/patch_xlsx_import_status.py
          python3 .github/scripts/patch_xlsx_sync_visibility.py
          node --check site/xlsx-reader.js
          node --check site/db.js
          node --check site/cloud.js
          node --check site/app.js
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Subir web estática
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
