name: Evaluar modo de turno móvil sin datos clínicos
on:
  pull_request:
    paths:
      - '.github/workflows/check-shift-readiness.yml'
      - '.github/scripts/shift_readiness.py'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extraer web y analizar funciones disponibles sin datos privados
        run: |
          set -e
          mkdir -p site
          base64 -d .deploy/web.xz.b64 | tar -xJf - -C site
          python3 .github/scripts/patch_web_cloud.py
          python3 .github/scripts/patch_onedrive_history_ui.py
          python3 .github/scripts/patch_excel_center.py
          cp web-import/xlsx-reader.js site/xlsx-reader.js
          python3 - <<'PY'
          from pathlib import Path
          content=Path('site/app.js').read_text()
          pos=content.find('function renderSync()')
          print('PRUEBA-RENDER:',repr(content[pos:pos+270]))
          tail=content.find('No hay capturas recibidas')
          print('PRUEBA-FIN-RENDER:',repr(content[tail:tail+350]))
          PY
          python3 .github/scripts/patch_xlsx_import.py
          node --check site/xlsx-reader.js
          python3 .github/scripts/shift_readiness.py
          node --check site/app.js
          node --check site/cloud.js
          node --check site/db.js
      - name: Leer un XLSX ficticio con el parser de navegador (sin Excel clínico)
        run: |
          python3 tests/generate_fake_xlsx.py
          npm install --no-save --no-package-lock --ignore-scripts @xmldom/xmldom@0.9.8
          node tests/test-xlsx-reader.mjs
