name: Validar asistente OneDrive Windows
on:
  pull_request:
    paths:
      - 'onedrive-sync/CONECTAR-ONEDRIVE-WINDOWS.cmd'
      - 'onedrive-sync/vincular-onedrive.ps1'
      - '.github/workflows/test-onedrive-onboarding.yml'
  push:
    branches:
      - feature/onedrive-onboarding-windows
permissions:
  contents: read
jobs:
  validate-windows-assistant:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar sintaxis PowerShell sin ejecutar autenticaciones
        shell: pwsh
        run: |
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile("onedrive-sync/vincular-onedrive.ps1",[ref]$tokens,[ref]$errors) | Out-Null
          if($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
          Write-Host "Sintaxis PowerShell correcta."
      - name: Verificar protecciones del asistente
        run: |
          python3 - <<'PY'
          from pathlib import Path
          script=Path("onedrive-sync/vincular-onedrive.ps1").read_text()
          wrapper=Path("onedrive-sync/CONECTAR-ONEDRIVE-WINDOWS.cmd").read_text()
          checks=[
              'Files.Read Files.Read.All offline_access',
              "drive_type -ne 'personal'",
              'No se ha compartido ni transmitido el Excel.',
              'Get-Command winget.exe',
              'config create mca-outlook onedrive',
          ]
          for text in checks:
              assert text in script, "Falta protección: "+text
          assert "vincular-onedrive.ps1" in wrapper
          assert 'ONEDRIVE_RCLONE_TOKEN' not in script
          assert "if(-not (Test-Path -LiteralPath $cfg -PathType Leaf))" in script
          assert "[System.IO.File]::WriteAllText($cfg, '')" in script
          assert script.index("WriteAllText($cfg, '')") < script.index('listremotes')
          assert "--log-level ERROR listremotes" in script
          assert "--log-level ERROR config dump" in script
          print("Verificación de permisos y ausencia de secretos: correcta.")
          PY

  test-windows-first-run:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validar en Windows PowerShell 5.1 y no sobrescribir configuración
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $file = Join-Path $env:RUNNER_TEMP 'mca-test-rclone.conf'
          try {
            if(Test-Path -LiteralPath $file){ Remove-Item -LiteralPath $file -Force }
            if(-not (Test-Path -LiteralPath $file -PathType Leaf)){
              [System.IO.File]::WriteAllText($file, '')
            }
            if(-not (Test-Path -LiteralPath $file -PathType Leaf)){ throw 'No se creó la configuración nueva' }
            [System.IO.File]::WriteAllText($file, 'CREDENCIAL_FICTICIA_PARA_PRUEBAS')
            if(-not (Test-Path -LiteralPath $file -PathType Leaf)){
              [System.IO.File]::WriteAllText($file, '')
            }
            $content = [System.IO.File]::ReadAllText($file)
            if($content -ne 'CREDENCIAL_FICTICIA_PARA_PRUEBAS'){
              throw 'Se sobrescribió una configuración preexistente'
            }
            Write-Host 'Primera ejecución y conservación de datos: correctas.'
          } finally {
            if(Test-Path -LiteralPath $file){ Remove-Item -LiteralPath $file -Force }
          }
